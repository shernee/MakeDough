<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecipeBend</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .shortcut-btn {
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
    }
    .shortcut-btn:hover { background: #f0f0f0; }
    .unit-btn {
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 3px;
    }
    .unit-btn:hover { background: #f0f0f0; }
  </style>
</head>
<body>
  <div x-data="recipeApp()" style="max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: sans-serif;">

    <h1>RecipeBend</h1>
    <p>Paste a recipe URL below to extract the recipe details.</p>

    <form @submit.prevent="extractRecipe" style="display: flex; gap: 8px; margin-bottom: 24px;">
      <input
        type="url"
        x-model="url"
        placeholder="https://www.example.com/recipe/..."
        required
        style="flex: 1; padding: 8px; font-size: 1rem;"
      />
      <button type="submit" :disabled="loading" style="padding: 8px 16px; font-size: 1rem; cursor: pointer;">
        <span x-show="!loading">Extract</span>
        <span x-show="loading">Extracting...</span>
      </button>
    </form>

    <div x-show="error" style="color: red; margin-bottom: 16px;">
      <strong>Error:</strong> <span x-text="error"></span>
    </div>

    <template x-if="recipe !== null">
      <div>
        <hr />

        <h2 x-text="recipe.title || 'Untitled Recipe'"></h2>

        <p x-show="recipe.servings">
          <strong>Servings:</strong> <span x-text="recipe.servings"></span>
        </p>

        <p x-show="recipe.total_time">
          <strong>Total Time:</strong> <span x-text="recipe.total_time + ' minutes'"></span>
        </p>

        <p>
          <strong>Source:</strong>
          <a :href="recipe.source_url" target="_blank" x-text="recipe.source_url"></a>
        </p>

        <!-- Ingredients: single column before any modification, two columns after -->
        <template x-if="modified === null">
          <div>
            <h3>Ingredients</h3>
            <template x-if="recipe.ingredients && recipe.ingredients.length > 0">
              <ul>
                <template x-for="ingredient in recipe.ingredients" :key="ingredient">
                  <li x-text="ingredient"></li>
                </template>
              </ul>
            </template>
            <p x-show="!recipe.ingredients || recipe.ingredients.length === 0">No ingredients found.</p>
          </div>
        </template>

        <template x-if="modified !== null">
          <div>
            <h3>Ingredients</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
              <div>
                <h4 style="margin-top: 0; color: #555;">Original</h4>
                <ul style="margin: 0; padding-left: 20px;">
                  <template x-for="ingredient in recipe.ingredients" :key="ingredient">
                    <li x-text="ingredient" style="margin-bottom: 4px; color: #777;"></li>
                  </template>
                </ul>
              </div>
              <div>
                <h4 style="margin-top: 0; color: #2a7a2a;">Current</h4>
                <ul style="margin: 0; padding-left: 20px;">
                  <template x-for="ingredient in modified.ingredients" :key="ingredient">
                    <li x-text="ingredient" style="margin-bottom: 4px;"></li>
                  </template>
                </ul>
              </div>
            </div>
          </div>
        </template>

        <h3>Steps</h3>
        <template x-if="recipe.steps && recipe.steps.length > 0">
          <ol>
            <template x-for="(step, index) in recipe.steps" :key="index">
              <li x-text="step" style="margin-bottom: 8px;"></li>
            </template>
          </ol>
        </template>
        <p x-show="!recipe.steps || recipe.steps.length === 0">No steps found.</p>

        <!-- PHASE 2: Recipe Modification -->
        <hr style="margin: 32px 0 24px;" />
        <h3 style="margin-top: 0;">Modify this Recipe</h3>
        <p style="margin-top: 0; color: #555; font-size: 0.9rem;">
          Describe the change you want. Each modification builds on the previous one.
        </p>

        <!-- Modification history trail -->
        <template x-if="modificationHistory.length > 0">
          <div style="margin-bottom: 16px; padding: 12px 16px; background: #f7f7f7; border-radius: 4px; border: 1px solid #e0e0e0;">
            <strong style="font-size: 0.85rem; color: #555; display: block; margin-bottom: 8px;">Modification history</strong>
            <ol style="margin: 0; padding-left: 20px;">
              <template x-for="(entry, index) in modificationHistory" :key="index">
                <li style="font-size: 0.9rem; margin-bottom: 4px;">
                  <span style="font-style: italic;" x-text="'&quot;' + entry.request + '&quot;'"></span>
                  <span style="color: #666;" x-text="' — ' + entry.result.changes_summary"></span>
                </li>
              </template>
            </ol>
          </div>
        </template>

        <!-- Shortcut controls -->
        <div style="margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">

          <!-- Dietary restrictions row -->
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%;">
            <span style="font-size: 0.8rem; color: #555; font-weight: 600; white-space: nowrap;">Diet:</span>
            <template x-for="restriction in dietaryRestrictions" :key="restriction.label">
              <button
                type="button"
                class="shortcut-btn"
                @click="appendText('make this ' + restriction.value)"
                x-text="restriction.label"
              ></button>
            </template>
          </div>

          <!-- Scaling row -->
          <div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap;">
            <span style="font-size: 0.8rem; color: #555; font-weight: 600; white-space: nowrap;">Scale:</span>
            <template x-for="factor in scalePresets" :key="factor.label">
              <button
                type="button"
                class="shortcut-btn"
                @click="appendScale(factor.value)"
                x-text="factor.label"
              ></button>
            </template>
            <input
              type="text"
              x-model="customFactor"
              placeholder="e.g. 1.5"
              style="width: 62px; padding: 4px 6px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 3px;"
            />
            <button
              type="button"
              class="shortcut-btn"
              @click="appendCustomScale"
              :disabled="!customFactor.trim()"
            >Apply</button>
          </div>

          <!-- Unit toggle -->
          <div style="display: flex; align-items: center; gap: 6px;">
            <span style="font-size: 0.8rem; color: #555; font-weight: 600; white-space: nowrap;">Units:</span>
            <button
              type="button"
              class="unit-btn"
              @click="appendText('convert measurements to cups, tablespoons, and teaspoons')"
            >Volume (cups/tbsp/tsp)</button>
            <button
              type="button"
              class="unit-btn"
              @click="appendText('convert measurements to grams and ml')"
            >Weight (grams/ml)</button>
          </div>

        </div>

        <form @submit.prevent="modifyRecipe" style="margin-bottom: 16px;">
          <textarea
            x-model="modifyRequest"
            :placeholder="modificationHistory.length === 0
              ? 'e.g. Make this recipe gluten-free...'
              : 'e.g. Now also double the quantities...'"
            rows="3"
            :disabled="modifying"
            style="width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; resize: vertical;"
          ></textarea>
          <div style="display: flex; align-items: center; gap: 12px; margin-top: 8px;">
            <button
              type="submit"
              :disabled="modifying || !modifyRequest.trim()"
              style="padding: 8px 16px; font-size: 1rem; cursor: pointer;"
            >
              <span x-show="!modifying">Modify Recipe</span>
              <span x-show="modifying">Modifying...</span>
            </button>
            <button
              type="button"
              x-show="modificationHistory.length > 0"
              @click="resetModifications"
              style="padding: 8px 16px; font-size: 1rem; cursor: pointer; background: none; border: 1px solid #ccc; color: #555;"
            >
              Reset to original
            </button>
          </div>
        </form>

        <div x-show="modifyError" style="color: red; margin-bottom: 16px;">
          <strong>Error:</strong> <span x-text="modifyError"></span>
        </div>

        <!-- Latest modification result -->
        <template x-if="modified !== null">
          <div>
            <div style="background: #f0f7ff; border-left: 4px solid #3a7bd5; padding: 12px 16px; margin-bottom: 16px; border-radius: 0 4px 4px 0;">
              <strong style="display: block; margin-bottom: 4px;">What changed in the last modification</strong>
              <span x-text="modified.changes_summary" style="font-size: 0.95rem;"></span>
            </div>

            <template x-if="modified.flags && modified.flags.length > 0">
              <div style="background: #fff8e6; border-left: 4px solid #e6a817; padding: 12px 16px; margin-bottom: 16px; border-radius: 0 4px 4px 0;">
                <strong style="display: block; margin-bottom: 8px;">Heads up</strong>
                <ul style="margin: 0; padding-left: 20px;">
                  <template x-for="flag in modified.flags" :key="flag">
                    <li x-text="flag" style="margin-bottom: 4px; font-size: 0.95rem;"></li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </template>

      </div>
    </template>

  </div>

  <script>
    function recipeApp() {
      return {
        url: '',
        recipe: null,
        loading: false,
        error: null,

        modifyRequest: '',
        modified: null,
        modifying: false,
        modifyError: null,
        modificationHistory: [],

        // Shortcut controls state
        customFactor: '',
        dietaryRestrictions: [
          { label: 'gluten free',  value: 'gluten free' },
          { label: 'dairy free',   value: 'dairy free' },
          { label: 'vegetarian',   value: 'vegetarian' },
          { label: 'vegan',        value: 'vegan' },
          { label: 'nut free',     value: 'nut free' },
        ],
        scalePresets: [
          { label: '⅓x', value: '0.33' },
          { label: '½x', value: '0.5' },
          { label: '¾x', value: '0.75' },
          { label: '2x',  value: '2' },
          { label: '3x',  value: '3' },
        ],

        // Append text to the textarea (with a space separator if not empty)
        appendText(text) {
          const current = this.modifyRequest.trimEnd();
          this.modifyRequest = current ? current + ', ' + text : text;
        },

        appendScale(factor) {
          this.appendText(`scale to ${factor}x`);
        },

        appendCustomScale() {
          const raw = this.customFactor.trim();
          if (!raw) return;
          // Accept decimals (1.5) or simple fractions (3/4) — pass as-is
          this.appendText(`scale to ${raw}x`);
          this.customFactor = '';
        },

        async extractRecipe() {
          this.error = null;
          this.recipe = null;
          this.modified = null;
          this.modifyError = null;
          this.modifyRequest = '';
          this.modificationHistory = [];
          this.loading = true;

          try {
            const response = await fetch('/extract', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ url: this.url }),
            });

            const data = await response.json();

            if (!response.ok) {
              this.error = data.error || 'An unexpected error occurred.';
            } else {
              this.recipe = data;
            }
          } catch (err) {
            this.error = 'Network error: could not reach the server.';
          } finally {
            this.loading = false;
          }
        },

        async modifyRecipe() {
          this.modifyError = null;
          this.modifying = true;

          const currentRecipe = this.modified
            ? { ...this.recipe, ingredients: this.modified.ingredients, servings: this.modified.servings }
            : this.recipe;

          const history = this.modificationHistory.map(h => ({
            request: h.request,
            changes_summary: h.result.changes_summary,
          }));

          try {
            const response = await fetch('/modify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                recipe: currentRecipe,
                request: this.modifyRequest,
                history: history,
              }),
            });

            const data = await response.json();

            if (!response.ok) {
              this.modifyError = data.error || 'An unexpected error occurred.';
            } else {
              this.modificationHistory.push({ request: this.modifyRequest, result: data });
              this.modified = data;
              this.modifyRequest = '';
            }
          } catch (err) {
            this.modifyError = 'Network error: could not reach the server.';
          } finally {
            this.modifying = false;
          }
        },

        resetModifications() {
          this.modified = null;
          this.modificationHistory = [];
          this.modifyRequest = '';
          this.modifyError = null;
        },
      };
    }
  </script>
</body>
</html>
